name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write: --comment below posts the review as a PR comment and inline
      # comments.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The review command is a local copy of the upstream code-review plugin
      # command (.github/claude-code-review/code-review.md; CLAUDE-248).
      # Upstream stops once Claude has commented on a PR at all, so later
      # pushes were never reviewed. The copy is read from the default branch,
      # so a PR cannot change its own review, and installed as a user command.
      # A run is skipped only when a claude[bot] "## Code review" summary ends
      # with this exact head SHA's marker. The command posts that comment
      # last, so a run cancelled partway through is reviewed again.
      # This step also saves claude[bot]'s earlier inline comments for the
      # command to read, so the review agent needs no gh api access.
      - name: Install review command and check for a completed review
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p "$HOME/.claude/commands"
          # A project command of the same name in the PR checkout would shadow
          # the user command installed below.
          rm -f .claude/commands/ci-code-review.md
          url="repos/$REPO/contents/.github/claude-code-review/code-review.md?ref=$DEFAULT_BRANCH"
          if ! gh api -H 'Accept: application/vnd.github.raw+json' "$url" \
              > "$HOME/.claude/commands/ci-code-review.md" 2> fetch.err; then
            if grep -q 'HTTP 404' fetch.err; then
              echo "::notice::review command is not on the default branch yet; skipping"
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat fetch.err >&2
            echo "::error::could not fetch the review command"
            exit 1
          fi
          export MARKER="<!-- claude-code-review head=$HEAD_SHA -->"
          found=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[]
              | select(.user.login == "claude[bot]")
              | select(.body | startswith("## Code review"))
              | select(.body | rtrimstr("\n") | endswith(env.MARKER))
              | .id')
          if [ -n "$found" ]; then
            echo "::notice::head $HEAD_SHA already has a completed Claude review; skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Remove whatever the PR put at this path first: a committed symlink
          # could otherwise redirect the write onto the installed command.
          rm -rf .claude-code-review
          mkdir .claude-code-review
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "claude[bot]")
              | {path, line: (.line // .original_line), body}' \
            > .claude-code-review/prior-inline-comments.jsonl
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        if: steps.gate.outputs.run == 'true'
        # Third-party action with write scopes: pin to a commit, not the
        # mutable v1 tag.
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1.0.245
        # --model below pins only the parent session. The review command
        # launches its own haiku, sonnet and opus subagents by family alias, so
        # pin what each alias resolves to. The action forwards exactly these
        # three variables to the Claude CLI. v1.0.245 installs Claude Code
        # 2.1.293, the first release that knows all three 5.5 IDs. Do not use
        # CLAUDE_CODE_SUBAGENT_MODEL: it would put every subagent on one model
        # and collapse the command's tiering.
        env:
          ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-5-5
          ANTHROPIC_DEFAULT_SONNET_MODEL: claude-sonnet-5-5
          ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-haiku-5-5
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Cloud agents (cursor[bot]) push PR branches; allow that bot so review
          # runs on synchronize without a manual re-trigger.
          allowed_bots: 'cursor,graphite-app'
          # Without --comment the command prints its findings to the hidden job
          # log and posts nothing. --head is the SHA its summary marker records.
          prompt: '/ci-code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment --head ${{ github.event.pull_request.head.sha }}'
          # The action stops at the first result message. Claude Code starts
          # subagents in the background, so the parent launched the command's
          # first Haiku agent, ended its turn, and the run finished before any
          # review agent ran (CLAUDE-230). Foreground subagents make the parent
          # wait for each one.
          settings: '{"env":{"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS":"1"}}'
          # Pin a full model ID, not an alias, so the action's default (or an
          # alias moving to a new release) cannot shift the review onto a
          # pricier model and drain the subscription token's limits.
          # --allowedTools: the action starts its inline-comment MCP server only
          # when that tool is listed here, and the command posts findings with
          # it. No gh api rule: earlier inline comments come from the gate
          # step's file, so the agent cannot call the API.
          claude_args: >-
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
