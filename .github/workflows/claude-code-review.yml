name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    # Spend cap, with --max-budget-usd below (CLAUDE-323): a stuck run stops
    # here instead of holding the subscription token for the 6-hour default.
    timeout-minutes: 30
    permissions:
      contents: read
      # write: --comment below posts the review as a PR comment and inline
      # comments.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # The review agent can read files in the checkout. Keep the job's
          # GITHUB_TOKEN out of .git/config so it cannot be read and posted
          # back in a comment (CLAUDE-350). Nothing here pushes.
          persist-credentials: false

      # The review command is a local copy of the upstream code-review plugin
      # command (.github/claude-code-review/code-review.md; CLAUDE-248).
      # Upstream stops once Claude has commented on a PR at all, so later
      # pushes were never reviewed. The copy is read from the default branch,
      # so a PR cannot change its own review, and installed as a user command.
      # A run is skipped only when a claude[bot] "## Code review" summary ends
      # with this exact head SHA's marker. The command posts that comment
      # last, so a run cancelled partway through is reviewed again.
      # This step also saves claude[bot]'s earlier inline comments for the
      # command to read, so the review agent needs no gh api access.
      - name: Install review command and check for a completed review
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # A committed .claude or .claude-code-review symlink could point the
          # rm -rf calls below at the runner's home directory (CLAUDE-350).
          for p in .claude .claude-code-review; do
            if [ -L "$p" ]; then
              echo "::error::$p is a symlink in this PR; refusing to run the review"
              exit 1
            fi
          done
          # gh api with three tries, so one transient API error does not fail
          # the job. A 404, or a 406 for a diff too large to return, is not
          # retried.
          gh_api() {
            local try out="$RUNNER_TEMP/gh-api.out" err="$RUNNER_TEMP/gh-api.err"
            for try in 1 2 3; do
              if gh api "$@" > "$out" 2> "$err"; then
                cat "$out"
                return 0
              fi
              if grep -qE 'HTTP 40[46]' "$err"; then
                break
              fi
              if [ "$try" -lt 3 ]; then sleep $((try * 5)); fi
            done
            cat "$err" >&2
            return 1
          }
          mkdir -p "$HOME/.claude/commands"
          # The review step loads user settings only (--setting-sources user),
          # so the PR's .claude/ and CLAUDE.md files do not load. Dropping these
          # directories as well keeps a PR command or skill from shadowing the
          # user command installed below if that flag is ever removed.
          rm -rf .claude/commands .claude/skills .claude/agents
          # The command has been on the default branch since #1842, so a
          # missing file is an error, not a reason to skip.
          url="repos/$REPO/contents/.github/claude-code-review/code-review.md?ref=$DEFAULT_BRANCH"
          if ! gh_api -H 'Accept: application/vnd.github.raw+json' "$url" \
              > "$HOME/.claude/commands/ci-code-review.md"; then
            echo "::error::could not fetch the review command from $DEFAULT_BRANCH"
            exit 1
          fi
          # The Bash guard hook (CLAUDE-356) the review step's settings run
          # before every Bash call. Without it the agent could expand a token
          # into a comment, so when the guard cannot be fetched (not yet on the
          # default branch, or an API error) the job skips the review with a
          # warning instead of running it unguarded.
          mkdir -p "$HOME/.claude/hooks"
          url="repos/$REPO/contents/.github/claude-code-review/bash-guard.sh?ref=$DEFAULT_BRANCH"
          if ! gh_api -H 'Accept: application/vnd.github.raw+json' "$url" \
              > "$HOME/.claude/hooks/claude-code-review-bash-guard.sh"; then
            echo "::warning::no Bash guard on $DEFAULT_BRANCH; skipping the review"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The guard only lets the agent touch this PR and post the marker for
          # this head, so a prompt-injected run cannot mark a future head as
          # reviewed or act on another repository.
          printf '%s %s %s\n' "$REPO" "$PR_NUMBER" "$HEAD_SHA" \
            > "$HOME/.claude/hooks/claude-code-review-target"
          export MARKER="<!-- claude-code-review head=$HEAD_SHA -->"
          found=$(gh_api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[]
              | select(.user.login == "claude[bot]")
              | select(.body | startswith("## Code review"))
              | select(.body | rtrimstr("\n") | endswith(env.MARKER))
              | .id')
          if [ -n "$found" ]; then
            echo "::notice::head $HEAD_SHA already has a completed Claude review; skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Remove whatever the PR put at this path first: a committed file
          # there must not reach the review agent.
          rm -rf .claude-code-review
          mkdir .claude-code-review
          # The file list and diff below come from the PR as it is now, so
          # they match this checkout only while HEAD_SHA is still the PR head.
          # A re-run of an older run would scan the wrong paths: skip it, the
          # newer head has its own run.
          pr_info=$(gh_api "repos/$REPO/pulls/$PR_NUMBER" \
            --jq '"\(.head.sha) \(.changed_files)"')
          read -r live_head changed_count <<< "$pr_info"
          if [ "$live_head" != "$HEAD_SHA" ]; then
            echo "::notice::PR head is now $live_head, not $HEAD_SHA; skipping this older run"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Paths this PR adds or changes, one JSON string per line so a
          # filename holding a newline stays one entry (the files API lists up
          # to 3000).
          gh_api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
            --jq '.[] | select(.status != "removed") | .filename | @json' \
            > .claude-code-review/changed-files.txt
          # A symlink committed in the PR could point the Read tool at
          # .git/config or /proc. Read deny rules check symlink targets, but
          # refuse links that leave the checkout or enter .git anyway. Only
          # the paths this PR changes, and the directories above them, are
          # checked: one such link already on the default branch would
          # otherwise fail every PR's review (CLAUDE-365). At the files API's
          # 3000-path cap the list may be cut short, so the whole tree is
          # scanned instead. A listed path that is absolute or has an empty,
          # "." or ".." part fails the job. It runs after the marker check, so
          # a reviewed head skips it too.
          if ! python3 -I - .claude-code-review/changed-files.txt <<'PY'
          import os, sys
          root = os.path.realpath(".")
          git = os.path.join(root, ".git")
          import json
          bad = set()
          with open(sys.argv[1], encoding="utf-8") as fh:
              paths = [json.loads(line) for line in fh if line.strip()]
          for rel in paths:
              parts = rel.split("/")
              if not rel or rel.startswith("/") or "\0" in rel or any(x in ("", ".", "..") for x in parts):
                  print(f"::error::unsafe path in the PR file list: {rel!r}")
                  sys.exit(1)
          if len(paths) >= 3000:
              paths = []
              for d, dirs, files in os.walk(root):
                  dirs[:] = [x for x in dirs if os.path.join(d, x) != git]
                  for name in dirs + files:
                      paths.append(os.path.relpath(os.path.join(d, name), root).replace(os.sep, "/"))
          for rel in paths:
              parts = rel.split("/")
              for i in range(1, len(parts) + 1):
                  p = os.path.join(root, *parts[:i])
                  if os.path.islink(p):
                      t = os.path.realpath(p)
                      if os.path.commonpath([root, t]) != root or os.path.commonpath([git, t]) == git:
                          bad.add("/".join(parts[:i]))
          for b in sorted(bad):
              print(f"::error::symlink leaves the checkout: {b}")
          sys.exit(1 if bad else 0)
          PY
          then
            exit 1
          fi
          # The whole diff as a file the agent reads in pages (CLAUDE-365).
          # gh pr diff output is cut off in the tool result on a large PR, and
          # the Bash guard allows no pipe or redirect to page it. When GitHub
          # refuses the diff as too large, build it from each file's patch;
          # files whose patch GitHub leaves out are named so the agent can say
          # they were not reviewed.
          if ! gh_api -H 'Accept: application/vnd.github.diff' \
              "repos/$REPO/pulls/$PR_NUMBER" > .claude-code-review/pr.diff; then
            echo "::notice::the full diff is too large for one request; building it per file"
            gh_api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
              --jq '.[] | "diff --git a/\(.previous_filename // .filename) b/\(.filename)\n"
                + "status: \(.status)\n"
                + (if .patch then .patch + "\n" else "(no patch from GitHub: binary or too large; not reviewed)\n" end)' \
              > .claude-code-review/pr.diff
            if [ "$changed_count" -gt 3000 ]; then
              echo "($((changed_count - 3000)) more changed files: GitHub lists only 3000; not reviewed)" \
                >> .claude-code-review/pr.diff
            fi
          fi
          # Every earlier claude[bot] inline comment, outdated ones included
          # and flagged, so a push that only moves a still-unfixed line
          # (reformat, rename, restack) does not repost the same issue
          # (CLAUDE-356). The trade-off: a bug fixed and then reintroduced in
          # the same PR is not flagged again, but its first comment is still
          # on the PR. Each body is wrapped in reference delimiters here, and
          # every "---" inside it is broken up until none is left, so no
          # indented, zero-width-prefixed or mid-line copy of a delimiter
          # survives. File-level comments have no line and are not outdated.
          gh_api --paginate "repos/$REPO/pulls/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "claude[bot]")
              | {path,
                 line: (.line // .original_line),
                 outdated: (.line == null and .subject_type != "file"),
                 body: ("--- begin prior comment (reference only) ---\n"
                   + (.body | until(test("---") | not; gsub("---"; "- --")))
                   + "\n--- end prior comment ---")}' \
            > .claude-code-review/prior-inline-comments.jsonl
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        if: steps.gate.outputs.run == 'true'
        # Third-party action with write scopes: pin to a commit, not the
        # mutable v1 tag.
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1.0.245
        # --model below pins only the parent session. The review command
        # launches its own haiku, sonnet and opus subagents by family alias, so
        # pin what each alias resolves to. The action forwards exactly these
        # three variables to the Claude CLI. v1.0.245 installs Claude Code
        # 2.1.293, the first release that knows all three 5.5 IDs. Do not use
        # CLAUDE_CODE_SUBAGENT_MODEL: it would put every subagent on one model
        # and collapse the command's tiering.
        env:
          ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-5-5
          ANTHROPIC_DEFAULT_SONNET_MODEL: claude-sonnet-5-5
          ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-haiku-5-5
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Cloud agents (cursor[bot]) push PR branches; allow that bot so review
          # runs on synchronize without a manual re-trigger.
          allowed_bots: 'cursor,graphite-app'
          # Without --comment the command prints its findings to the hidden job
          # log and posts nothing. --head is the SHA its summary marker records.
          prompt: '/ci-code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment --head ${{ github.event.pull_request.head.sha }}'
          # The action stops at the first result message. Claude Code starts
          # subagents in the background, so the parent launched the command's
          # first Haiku agent, ended its turn, and the run finished before any
          # review agent ran (CLAUDE-230). Foreground subagents make the parent
          # wait for each one.
          # hooks: the gate step installed the Bash guard from the default
          # branch. It allows only gh pr diff/view with a few listed flags and a
          # gh pr comment whose body is the fixed summary, so no variable,
          # command substitution or read-only command (cat, echo, env) can
          # put a token in a comment (CLAUDE-356).
          settings: '{"env":{"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS":"1"},"hooks":{"PreToolUse":[{"matcher":"Bash","hooks":[{"type":"command","command":"bash \"$HOME/.claude/hooks/claude-code-review-bash-guard.sh\""}]}]}}'
          # Pin a full model ID, not an alias, so the action's default (or an
          # alias moving to a new release) cannot shift the review onto a
          # pricier model and drain the subscription token's limits.
          # --allowedTools: the action starts its inline-comment MCP server only
          # when that tool is listed here, and the command posts findings with
          # it. No gh api rule: earlier inline comments come from the gate
          # step's file, so the agent cannot call the API.
          # --setting-sources user: the PR's .claude/settings.json (hooks,
          # permissions), commands, skills, agents and CLAUDE.md files do not
          # load (CLAUDE-350). The command reads CLAUDE.md files itself.
          # --disallowedTools: the summary is posted with --body. Reading a
          # file into a comment (-F, --body-file) is denied, so a
          # prompt-injected run cannot post a runner file. Deny rules win over
          # the command's allowed-tools.
          # Read(./.git): before Claude starts, the action's agent mode writes
          # its GitHub App token into the origin URL in .git/config
          # (configureGitAuth in v1.0.245), so persist-credentials: false alone
          # does not keep a token out of the checkout (CLAUDE-356). The token
          # is revoked when the job ends, but a read pasted into a comment
          # would post it while it is live. Read(//proc): the CLI's
          # environment holds that token and CLAUDE_CODE_OAUTH_TOKEN. The
          # Read tool already needs approval outside the checkout, which a CI
          # run cannot give, since the command no longer grants bare Read.
          # Read deny rules also cover Grep and Glob; Bash is the hook's job.
          # --max-budget-usd: cap on the run's API-equivalent cost, subagents
          # included (CLAUDE-323). A normal review costs about $1; a run that
          # hits the cap stops before posting the summary, so the next push
          # reviews that PR again.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-budget-usd 5
            --setting-sources user
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --disallowedTools "Bash(gh pr comment -F*),Bash(gh pr comment --body-file*),Bash(gh pr comment * -F*),Bash(gh pr comment * --body-file*),Read(./.git),Read(./.git/**),Read(//proc),Read(//proc/**)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
