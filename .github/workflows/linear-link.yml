name: Linear Link

# Advisory: every PR should reference a Linear issue in the CLAUDE team before
# it merges. A missing reference adds a warning annotation and a job-summary
# note; the job never fails, so it is safe to leave out of required checks.
# Linear's "Automatically link or create issues on merge" setting only creates
# an issue for a PR that is still unlinked at merge, and then it guesses the
# team. A PR that names CLAUDE-<number> or CLAUDE-NEW is never guessed.
#
# Finds a link when any of these holds (word-boundary match):
#   branch name     CLAUDE-<number> or claude-<number> (Linear's lowercase form)
#   PR title        CLAUDE-<number> (case-sensitive)
#   PR description  CLAUDE-<number> or CLAUDE-NEW after a Linear magic word
#                   (Fixes, Closes, Resolves, Refs, Part of, ...), as Linear
#                   requires; the key is case-sensitive and text inside
#                   <!-- --> comments does not count
# An ID named by "Ignore <ID>" or "Skip <ID>" in the description never counts,
# from any source.
# CLAUDE-NEW creates an issue only when the PR links no other issue, so it
# warns when the branch (Linear's team-123-slug form) or a "Fixes/Refs <ID>"
# phrase in the description names another team's issue.
# The check is syntax-only: it does not ask Linear whether the issue exists.
#
# PR fields reach the script only through env, never through ${{ }} inside
# run:, so a crafted title, body or branch name cannot inject shell. The job
# checks out nothing and holds no token scope.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: linear-link-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  linear-link:
    name: linear-link
    # Bot PRs (the Changesets "chore: version packages" PR, Graphite merge
    # queue drafts on gtmq_* branches) carry no Linear reference by design.
    # A skipped job still satisfies a required status check.
    if: >-
      github.event.pull_request.user.type != 'Bot' &&
      !startsWith(github.event.pull_request.head.ref, 'gtmq_')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Check for a CLAUDE issue reference
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # IDs are matched on word boundaries (no [A-Za-z0-9_] on either
          # side) with zero-width lookarounds, so adjacent references such as
          # claude-1-claude-2 are both found. Numeric IDs link from the
          # branch, title or description; CLAUDE-NEW only works in the
          # description, where Linear reads it as "create the issue in CLAUDE".
          # ids SOURCE MODE: print matching IDs, uppercased, one per line.
          # MODE: branch (CLAUDE-n or claude-n), title (CLAUDE-n). perl reads
          # the whole input, so no pipe writer can take SIGPIPE under pipefail.
          ids() {
            MODE="$2" perl -0ne '
              my %re = (
                branch => qr/(?<![A-Za-z0-9_])(CLAUDE-\d+|claude-\d+)(?![A-Za-z0-9_])/,
                title  => qr/(?<![A-Za-z0-9_])(CLAUDE-\d+)(?![A-Za-z0-9_])/,
              );
              my $re = $re{$ENV{MODE}};
              print uc($1), "\n" while /$re/g;
            ' <<<"$1"
          }
          # Body cleanup: drop HTML comments (an unclosed one hides the rest of
          # the rendered body) so the template's example never counts.
          body=$(printf '%s' "${PR_BODY:-}" | perl -0pe 's/<!--.*?(?:-->|\z)//gs')
          # "Ignore <ID>" (or "Skip <ID>") tells Linear never to link that ID from any source.
          ignored=$(perl -0ne 'print uc($1), "\n" while /(?<![A-Za-z0-9_])(?:ignore|skip)[:\s]*([A-Za-z][A-Za-z0-9]*-\d+)(?![A-Za-z0-9_])/gi' <<<"$body")
          body=$(perl -0pe 's/\b(?:ignore|skip)\b[:\s]*[A-Za-z][A-Za-z0-9]*-(?:\d+|new)\b//gi' <<<"$body")
          # refs TEXT: print every issue ID (any team, or TEAM-NEW) that follows
          # one of Linear's magic words, including lists such as
          # "Fixes CLAUDE-1, CLAUDE-2". A bare mention does not link in Linear.
          refs() {
            perl -0ne '
              my $id = qr/[A-Z][A-Z0-9]*-(?:\d+|NEW)/;
              # A reference is a bare ID or a Linear issue URL.
              my $ref = qr{(?:https?://linear\.app/[^/\s]+/issue/)?$id(?![A-Za-z0-9_])(?:/[^\s,]*)?};
              my $word = qr/(?i:close[sd]?|closing|fix(?:es|ed|ing)?|resolve[sd]?|resolving|complete[sd]?|completing|refs?|references|part\s+of|related\s+to|contributes\s+to|towards?)/;
              my $sep = qr/\s*(?:,\s*(?:and\s+)?|&|\band\b)\s*/;
              while (/(?<![A-Za-z0-9_])$word[:\s]+($ref(?:$sep$ref)*)/g) {
                my $list = $1;
                print "$1\n" while $list =~ m{(?:^|[\s,&/]|\band\b)($id)(?![A-Za-z0-9_])}g;
              }
            ' <<<"$1"
          }
          body_refs=$(refs "$body")
          linked() {
            local id
            while IFS= read -r id; do
              [ -n "$id" ] || continue
              grep -qxF -- "$id" <<<"$ignored" || return 0
            done <<<"$1"
            return 1
          }
          found=''
          if linked "$(ids "$PR_BRANCH" branch)"; then
            found='branch name'
          elif linked "$(ids "$PR_TITLE" title)"; then
            found='PR title'
          elif linked "$(grep -E '^CLAUDE-[0-9]+$' <<<"$body_refs" || true)"; then
            found='PR description'
          fi
          if [ -n "$found" ]; then
            echo "Linear link found in the $found."
            exit 0
          fi
          if grep -qx CLAUDE-NEW <<<"$body_refs"; then
            # Other-team references that stop CLAUDE-NEW from creating an
            # issue: a Linear-style branch segment (eng-123-slug) or a
            # magic-word phrase in the description. Output is limited to
            # [A-Z0-9-], so it is safe to print.
            others=$(
              {
                perl -ne 'print uc($1), "\n" while m{(?:^|/)([A-Za-z][A-Za-z0-9]*-\d+)(?=-|$)}g' <<<"$PR_BRANCH"
                grep -E -- '-[0-9]+$' <<<"$body_refs" || true
              } | grep -v '^CLAUDE-' | grep -vxF -f <(printf '%s\n' "$ignored") | sort -u | paste -sd ' ' -
            ) || true
            if [ -z "$others" ]; then
              echo "Linear link found in the PR description (CLAUDE-NEW)."
              exit 0
            fi
            echo "::warning title=CLAUDE-NEW will not create an issue::This PR also references $others, so Linear will link that instead of creating a CLAUDE issue. Create the CLAUDE issue in Linear and put 'Fixes CLAUDE-123' in the PR description, or add 'Ignore <ID>' for a reference that should not link. (Advisory only; this check does not block the merge.)"
            {
              echo "## CLAUDE-NEW will not create an issue"
              echo
              echo "This PR also references $others. Linear creates a CLAUDE-NEW issue only when the PR links no other issue, so this PR would end up linked only to that issue. This check is advisory and does not block the merge."
              echo
              echo "- Create the CLAUDE issue in Linear and put \`Fixes CLAUDE-123\` in the PR description, or"
              echo "- add \`Ignore <ID>\` to the description for a reference that should not link."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The untrusted fields are never echoed, so they cannot emit
          # workflow commands.
          msg='This PR does not reference a Linear issue in the CLAUDE team.'
          echo "::warning title=Missing Linear issue::$msg Add 'Fixes CLAUDE-123' (or 'Refs CLAUDE-123' for partial work) to the PR description, or 'Fixes CLAUDE-NEW' if no issue exists yet. Saving the edited description re-runs this check. (Advisory only; this check does not block the merge.)"
          {
            echo "## Missing Linear issue"
            echo
            echo "$msg Linear would otherwise create an issue at merge and guess its team. This check is advisory and does not block the merge."
            echo
            echo "Fix it in one of these ways, then save the PR description (this check re-runs on edit):"
            echo
            echo "- Existing issue: add \`Fixes CLAUDE-123\` to the PR description (\`Refs CLAUDE-123\` for partial work)."
            echo "- No issue yet: add \`Fixes CLAUDE-NEW\` to the PR description, and Linear files one in CLAUDE."
            echo "- Or start the branch from Linear's \"Copy git branch name\" (\`…/claude-123-…\`)."
            echo
            echo "The key is case-sensitive: \`CLAUDE-123\`, not \`claude-123\`, in the title and description."
          } >> "$GITHUB_STEP_SUMMARY"
