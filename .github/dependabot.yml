# Dependabot version updates. Security updates are switched on separately in
# the repository's Code security settings.
#
# Plugin lockfiles under plugins/*/ are pinned on purpose (supply-chain
# guarantee, docs/upstream-pins.md) and are not listed here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
